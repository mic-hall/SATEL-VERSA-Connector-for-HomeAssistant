name: Tests and release packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov --cov-fail-under=85 --cov-report=term-missing
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: satel-versa-packages
          path: dist/
