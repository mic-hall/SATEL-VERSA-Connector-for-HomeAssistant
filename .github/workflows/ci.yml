name: Tests and release packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.10.1", "2026.10.4"]
        include:
          - ha: "2026.10.1"
            test-harness: "0.13.372"
          - ha: "2026.10.4"
            test-harness: "0.13.375"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install "pytest-homeassistant-custom-component==${{ matrix.test-harness }}" "ruff==0.17.4"
      - run: python -c "import importlib.metadata as m; assert m.version('homeassistant') == '${{ matrix.ha }}'"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov --cov-fail-under=85 --cov-report=term-missing
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: satel-versa-packages-${{ matrix.ha }}
          path: dist/
